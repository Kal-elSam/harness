name: Kairo UI prebuilt (matrix)

# Per-runner host --v3-capture proof for each packaging triple.
# Does NOT fake multiplatform exec on a single Mac.
#
# Manual only (workflow_dispatch). Kept off PR/push so ordinary CI stays lean.
# Activate from Actions → "Kairo UI prebuilt" → Run workflow when closing U6
# foreign-exec gaps.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-v3-capture:
    name: Build + --v3-capture (${{ matrix.key }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            key: darwin-arm64
          - os: macos-15-intel
            key: darwin-x64
          - os: ubuntu-24.04
            key: linux-x64
          - os: ubuntu-24.04-arm
            key: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build host kairo-ui prebuilt
        run: bash scripts/build-kairo-ui-binaries.sh --host-only

      - name: Assert expected host key exists
        run: |
          bin="dist/kairo-ui/${{ matrix.key }}/kairo-ui"
          test -x "$bin"
          file "$bin"

      - name: Host --v3-capture
        run: |
          out="$(mktemp -d)"
          "dist/kairo-ui/${{ matrix.key }}/kairo-ui" --v3-capture "$out"
          test "$(find "$out" -type f | wc -l | tr -d ' ')" -ge 10
